<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据审核</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>数据审核</h1>
  <label class="reviewer">审核人
    <input id="reviewer" placeholder="填写你的名字" autocomplete="name">
  </label>
  <button id="btn-import">导入论文</button>
  <span class="spacer"></span>
  <label class="export-scope" title="导出当前选中的文档；左侧选“全部文档”时导出全部">导出范围
    <select id="x-scope">
      <option value="approved">已确认（三层都确认）</option>
      <option value="all">全部（含未审核，不含已拒绝）</option>
    </select>
  </label>
  <button id="btn-xlsx">导出 Excel</button>
  <button id="btn-csv">导出 CSV</button>
</header>

<main>
  <aside id="sidebar">
    <div class="filters">
      <select id="f-doc"><option value="">全部文档</option></select>
      <select id="f-kind">
        <option value="">全部层级</option>
        <option value="source">论文</option>
        <option value="condition">条件</option>
        <option value="observation">观测值</option>
      </select>
      <select id="f-status">
        <option value="pending">待审核</option>
        <option value="needs_resolution">待解决</option>
        <option value="approved">已确认</option>
        <option value="rejected">已拒绝</option>
        <option value="">全部状态</option>
      </select>
      <select id="f-flag">
        <option value="">全部</option>
        <option value="true">有 flag</option>
        <option value="false">无 flag</option>
      </select>
    </div>
    <div id="doc-panel" hidden></div>
    <div id="counts" class="muted"></div>
    <ul id="list"></ul>
  </aside>

  <section id="source">
    <div class="pane-title">原文 <span id="doc-title" class="muted"></span></div>
    <div id="source-text" class="muted">← 选择一条记录</div>
  </section>

  <section id="detail">
    <div class="pane-title">记录</div>
    <div id="detail-body" class="muted">未选择</div>
  </section>
</main>

<dialog id="import-dlg">
  <form id="import-form" method="dialog">
    <h3>导入论文</h3>
    <p class="muted">上传后只在本机把 PDF 转成文字，不调用 API。检查原文没问题后，再在左侧点“开始提取”。</p>
    <label>文件（PDF 或 TXT）<input type="file" id="i-file" accept=".pdf,.txt" required></label>
    <label>标题（如 2017_NG，默认用文件名）<input id="i-title" placeholder="YYYY_SURNAME"></label>
    <div class="row">
      <button type="submit" class="primary" id="i-go">上传并转换</button>
      <button type="button" id="i-close">关闭</button>
    </div>
    <div id="i-result" class="muted"></div>
  </form>
</dialog>

<div id="toast" hidden></div>
<script src="highlight.js"></script>
<script src="app.js"></script>
</body>
</html>
